<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>QC Digital Specbook - QR Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1a73e8;
      font-size: 23px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-radius: 12px;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      color: #666;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #f1f3f4;
      border-radius: 10px;
    }

    .button {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>📷 QC DIGITAL SPECBOOK</h1>

    <p
      id="status"
      class="status"
    >
      Menyiapkan kamera...
    </p>

    <div id="reader"></div>


    <div
      id="hasil"
      class="result"
    >

      <b>SKU:</b>

      <div id="sku"></div>

      <br>

      <b>Tanggal:</b>

      <div id="tanggal"></div>


      <a
        id="lanjut"
        class="button"
        href="#"
      >
        🔎 BUKA QC DIGITAL SPECBOOK
      </a>

    </div>

  </div>


  <script>

    let scanner = null;

    let sudahScan = false;


    // ==========================
    // PROSES QR
    // ==========================

    function hasilScan(decodedText) {

      if (sudahScan) {
        return;
      }

      sudahScan = true;


      console.log(
        "QR terbaca:",
        decodedText
      );


      // Contoh:
      // 123456;06/10/2026

      const bagian =
        decodedText
          .trim()
          .split(";");


      const sku =
        bagian[0]
          .trim();


      const tanggal =
        bagian.length > 1
          ? bagian[1].trim()
          : "-";


      // Tampilkan hasil

      document.getElementById("sku")
        .innerText = sku;


      document.getElementById("tanggal")
        .innerText = tanggal;


      document.getElementById("hasil")
        .style.display = "block";


      document.getElementById("status")
        .innerText =
        "✅ QR berhasil dibaca";


      // Hentikan scanner

      if (scanner) {

        scanner.stop()
          .then(function() {

            scanner.clear();

          })
          .catch(function() {});

      }


      /*
        NANTI KITA ISI DENGAN URL
        WEB APP APPS SCRIPT.
      */

      const webAppURL =
        "MASUKKAN_URL_WEB_APP_DI_SINI";


      const tujuan =
        webAppURL +
        "?sku=" +
        encodeURIComponent(sku) +
        "&tanggal=" +
        encodeURIComponent(tanggal);


      document.getElementById("lanjut")
        .href = tujuan;

    }


    // ==========================
    // START SCANNER
    // ==========================

    function mulaiScanner() {
  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 15,
    qrbox: function(viewfinderWidth, viewfinderHeight) {
      const size = Math.floor(
        Math.min(viewfinderWidth, viewfinderHeight) * 0.70
      );

      return {
        width: size,
        height: size
      };
    },
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ]
  };

  Html5Qrcode.getCameras()
    .then(function(cameras) {

      if (!cameras || cameras.length === 0) {
        throw new Error("Kamera tidak ditemukan oleh browser.");
      }

      // Prioritaskan kamera belakang
      let kameraBelakang = cameras.find(function(camera) {
        const label = camera.label.toLowerCase();

        return (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment") ||
          label.includes("belakang")
        );
      });

      const cameraId = kameraBelakang
        ? kameraBelakang.id
        : cameras[0].id;

      document.getElementById("status").innerText =
        "📷 Kamera ditemukan — memulai scanner...";

      return scanner.start(
        cameraId,
        config,
        function(decodedText) {
          hasilScan(decodedText);
        },
        function(errorMessage) {
          // QR belum terbaca
        }
      );
    })

    .then(function() {
      document.getElementById("status").innerText =
        "📷 Kamera aktif — arahkan ke QR";
    })

    .catch(function(error) {

      console.error("ERROR KAMERA:", error);

      let pesan = "";

      if (error && error.name) {
        pesan += error.name + " - ";
      }

      if (error && error.message) {
        pesan += error.message;
      } else {
        pesan += String(error);
      }

      document.getElementById("status").innerText =
        "❌ ERROR KAMERA: " + pesan;
    });
}

    }


    // Jalankan scanner

    mulaiScanner();

  </script>

</body>

</html>
